<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hate Speech Detection Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Use Inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar for chat log - More subtle dark-mode scrollbar */
        #chat-log::-webkit-scrollbar {
            width: 8px; /* Slightly wider */
        }
        #chat-log::-webkit-scrollbar-track {
            background: #1f2937; /* bg-gray-800 equivalent */
        }
        #chat-log::-webkit-scrollbar-thumb {
            background: #4b5563; /* bg-gray-600 equivalent */
            border-radius: 4px;
        }
        #chat-log::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* bg-gray-500 equivalent */
        }

        /* Custom glow/shadow for the container */
        .chat-container {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05); /* Deeper shadow and a subtle white border */
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Refined dark palette
                        'dark-bg': '#111827', // Deeper background
                        'dark-card': '#1f2937', // Main container/card
                        'dark-surface': '#374151', // Header/Input background
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-dark-bg text-gray-100 flex items-center justify-center p-4">

    <div class="flex flex-col h-[95vh] w-full max-w-xl bg-dark-card rounded-3xl shadow-2xl overflow-hidden chat-container transition-all duration-300">
        
        <header class="bg-dark-surface p-4 border-b border-gray-700 shadow-xl z-10">
            <div class="flex items-center space-x-4">
                <div class="flex space-x-2">
                    <div class="w-3 h-3 bg-red-500 rounded-full hover:bg-red-400 transition-colors cursor-pointer"></div>
                    <div class="w-3 h-3 bg-yellow-500 rounded-full hover:bg-yellow-400 transition-colors cursor-pointer"></div>
                    <div class="w-3 h-3 bg-green-500 rounded-full hover:bg-green-400 transition-colors cursor-pointer"></div>
                </div>
                <h1 class="text-xl font-bold ml-auto text-gray-50">Hate Speech <span class="text-blue-400">Moderator</span></h1>
                <div class="flex-grow"></div> </div>
        </header>

        <main id="chat-log" class="flex-1 p-6 space-y-6 overflow-y-auto">
            <div class="flex justify-start">
                <div class="max-w-xs lg:max-w-md bg-dark-surface p-4 rounded-xl shadow-lg rounded-tl-none">
                    <p class="text-base text-gray-200">
                        Hello! I am a **Content Moderation Bot**. Please type a message, and I will classify it as:
                    </p>
                    <ul class="list-disc list-inside mt-2 text-sm ml-2">
                        <li class="font-medium text-green-400">Normal</li>
                        <li class="font-medium text-yellow-400">Offensive</li>
                        <li class="font-medium text-red-400">Hate Speech</li>
                    </ul>
                    <p class="text-xs text-gray-400 mt-3 border-t border-gray-600 pt-2">Powered by a live Python ML model. *Note: Classification is for demonstration.*</p>
                </div>
            </div>
        </main>

        <footer class="bg-dark-surface p-4 border-t border-gray-700">
            <div class="flex space-x-3">
                <input type="text" id="user-input" placeholder="Type your message..." 
                       class="flex-1 bg-dark-card text-gray-100 border border-gray-600 rounded-full px-5 py-3 
                              focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200 
                              placeholder-gray-500 shadow-inner" 
                       autocomplete="off">
                <button id="send-button" 
                        class="bg-blue-600 text-white font-semibold w-12 h-12 flex items-center justify-center rounded-full 
                               hover:bg-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50 
                               transition-all duration-200 transform hover:scale-105 shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.428A1 1 0 009 16.5v-4.5a1 1 0 011-1h.5a1 1 0 011 1v4.5a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.409l-7-14z" />
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        // --- DOM Elements ---
        const chatLog = document.getElementById('chat-log');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        // --- Event Listeners ---
        sendButton.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });

        /**
         * Handles sending a message: gets user input, displays it, and gets a bot response.
         */
        function handleSendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            // 1. Display the user's message
            displayMessage(message, 'user');

            // 2. Clear the input
            userInput.value = '';

            // 3. Get and display the bot's response
            getBotResponse(message);
        }

        /**
         * Displays a message in the chat log.
         * @param {string} message - The text content of the message.
         * @param {string} sender - 'user' or 'bot'.
         * @param {object} [classification] - Optional classification result object.
         */
        function displayMessage(message, sender, classification = null) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('flex', 'max-w-full'); // Added max-w-full for better message wrapping

            // Use rounded-xl for a softer look, removing the hard triangle shape
            let bubbleClasses = 'p-4 rounded-xl shadow-lg transition-all duration-300';
            let content = `<p class="text-base">${message}</p>`; // Increased text size for better readability
            
            if (sender === 'user') {
                messageElement.classList.add('justify-end');
                // Brighter user bubble
                bubbleClasses += ' bg-blue-500 text-white rounded-br-none'; 
            } else {
                messageElement.classList.add('justify-start');
                
                // --- Apply dynamic styling based on classification ---
                if (classification) {
                    if (classification.class === 0) { // Hate
                        bubbleClasses += ' bg-red-700 text-white border border-red-500 rounded-tl-none'; // Deeper red, border for emphasis
                        content = `
                            <p class="font-bold text-base mb-1">HATE SPEECH</p>
                            <p class="text-sm">This content is flagged as hate speech and is highly violative. Confidence: <span class="font-mono">${(classification.confidence * 100).toFixed(2)}%</span></p>
                            <div class="mt-3 pt-2 border-t border-red-500">
                                <p class="text-xs text-red-200 italic">Original: "${message}"</p>
                            </div>
                        `;
                    } else if (classification.class === 1) { // Offensive
                        bubbleClasses += ' bg-yellow-600 text-gray-900 border border-yellow-400 rounded-tl-none'; // Yellow-600 for high contrast
                        content = `
                            <p class="font-bold text-base mb-1">OFFENSIVE CONTENT</p>
                            <p class="text-sm">This content is flagged as offensive language. Confidence: <span class="font-mono">${(classification.confidence * 100).toFixed(2)}%</span></p>
                            <div class="mt-3 pt-2 border-t border-yellow-700">
                                <p class="text-xs text-yellow-900 italic">Original: "${message}"</p>
                            </div>
                        `;
                    } else { // Neither/Normal
                        bubbleClasses += ' bg-green-600 text-white border border-green-500 rounded-tl-none';
                        content = `
                            <p class="font-bold text-base mb-1">NORMAL SPEECH</p>
                            <p class="text-sm">This content appears to be normal and non-violative. Confidence: <span class="font-mono">${(classification.confidence * 100).toFixed(2)}%</span></p>
                            <div class="mt-3 pt-2 border-t border-green-500">
                                <p class="text-xs text-green-200 italic">Original: "${message}"</p>
                            </div>
                        `;
                    }
                } else {
                    // Default bot bubble for non-classification messages (e.g., error/analyzing)
                    bubbleClasses += ' bg-dark-surface text-gray-100 rounded-tl-none';
                    content = `<p class="text-base">${message}</p>`;
                }
            }

            // Wrapping the message content for maximum width constraint
            messageElement.innerHTML = `<div class="${bubbleClasses} max-w-[85%]">${content}</div>`;
            chatLog.appendChild(messageElement);

            // Scroll to the bottom
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        /**
         * Gets a response from the "bot" by calling the Python API.
         * @param {string} message - The user's input message.
         */
        async function getBotResponse(message) {
            // Display a temporary "analyzing" message
            const analyzingElement = document.createElement('div');
            analyzingElement.classList.add('flex', 'justify-start', 'analyzing-bubble');
            analyzingElement.innerHTML = `
                <div class="bg-gray-600 p-4 rounded-xl shadow-md rounded-tl-none">
                    <p class="text-sm italic text-gray-300">Analyzing content...</p>
                </div>
            `;
            chatLog.appendChild(analyzingElement);
            chatLog.scrollTop = chatLog.scrollHeight;
            
            // --- API Call to Python Backend ---
            // Dynamically determine API URL based on current location
            const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://127.0.0.1:5000/classify'
                : '/classify';
            let classification;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    // Handle server errors (e.g., 500)
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                classification = await response.json();

            } catch (error) {
                console.error("Error calling classification API:", error);
                // Create a special error classification to display
                classification = {
                    class: -1, // Custom error class
                    label: "Connection Error",
                    message: "Could not connect to the Python model. Please ensure the server is running. Run `python3 app.py`."
                };
            }
            // ----------------------------------------

            // Remove the "analyzing" message
            const tempBubble = chatLog.querySelector('.analyzing-bubble');
            if (tempBubble) {
                chatLog.removeChild(tempBubble);
            }
            
            // Display the *actual* classification result
            if (classification.class === -1) {
                // Show a special error message in the chat
                displayMessage(classification.message, 'bot');
            } else {
                // Pass the original message to be quoted in the response
                displayMessage(message, 'bot', classification);
            }
        }
    </script>
</body>
</html>
